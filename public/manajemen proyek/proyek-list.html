<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Proyek</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/proyek-list.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

    <!-- Header -->
    <div class="a1 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto">
        <button onclick="toggleSidebar()" class="md:hidden p-1 -ml-1 text-slate-400 hover:text-slate-600 flex-shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div>
          <p class="syne text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
          <h1 class="syne font-extrabold text-2xl md:text-4xl text-gray-900 leading-tight">Daftar Proyek</h1>
          <p class="text-sm text-gray-400 mt-1">Pantau dan kelola seluruh proyek berjalan</p>
        </div>
      </div>
      <a href="proyek-form.html" class="btn-primary w-full md:w-auto justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        Buat Proyek Baru
      </a>
    </div>

    <!-- Table Card -->
    <div class="card p-5 md:p-7 a2">

      <!-- Toolbar -->
      <div class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col md:flex-row justify-between gap-4">

          <!-- Filters -->
          <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto flex-wrap">
            <div class="relative w-full md:w-64">
              <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="searchInput" placeholder="Cari proyek..." class="search-box w-full"
                style="padding-left:40px">
            </div>

            <select id="filterStatus" class="search-box cursor-pointer w-full md:w-auto">
              <option value="">Semua Status</option>
              <option value="Planning">Planning</option>
              <option value="On Progress">On Progress</option>
              <option value="Completed">Completed</option>
            </select>

            <select id="sortBy" class="search-box cursor-pointer w-full md:w-auto">
              <option value="name_asc">Nama (A-Z)</option>
              <option value="name_desc">Nama (Z-A)</option>
              <option value="deadline">Deadline Terdekat</option>
              <option value="newest">Proyek Terbaru</option>
            </select>
          </div>

          <div class="count-chip self-end md:self-center">
            Total <span id="projCount">0</span> proyek
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="tbl-wrap overflow-x-auto">
        <table class="w-full min-w-[900px]">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Proyek</th>
              <th>Klien</th>
              <th>Status</th>
              <th>Tanggal</th>
              <th>PIC</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="proyekTable">
            <tr>
              <td colspan="7">
                <div class="empty-state">
                  <svg class="w-10 h-10 mx-auto mb-3 text-gray-200 animate-spin" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                  </svg>
                  Memuat data...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const API = "/api/projects";
    let allData = [];

    function getBadgeClass(status) {
      if (status === 'Planning') return 'badge-planning';
      if (status === 'On Progress') return 'badge-progress';
      if (status === 'Completed') return 'badge-completed';
      return 'badge-planning';
    }

    function renderTable(data) {
      const table = document.getElementById("proyekTable");
      document.getElementById("projCount").textContent = data.length;

      if (!data.length) {
        table.innerHTML = `
          <tr><td colspan="7">
            <div class="empty-state">Belum ada data proyek</div>
          </td></tr>`;
        return;
      }

      table.innerHTML = data.map((p, index) => `
        <tr>
          <td><span class="no-badge">${index + 1}</span></td>
          <td>
            <div class="flex items-center gap-3">
              <div class="proj-icon">${p.name.charAt(0).toUpperCase()}</div>
              <span class="font-semibold text-gray-900">${p.name}</span>
            </div>
          </td>
          <td class="text-gray-400">${p.client}</td>
          <td>
            <span class="badge ${getBadgeClass(p.status)}">
              <span class="badge-dot"></span>${p.status}
            </span>
          </td>
          <td>
            <span class="date-range">
              ${p.start_date} — ${p.end_date}
            </span>
          </td>
          <td class="text-gray-500">${p.pic}</td>
          <td>
            <div class="flex items-center justify-end gap-2">
              <a href="proyek-edit.html?id=${p.id}" class="btn-edit">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Edit
              </a>
              <button onclick="deleteProject(${p.id})" class="btn-del">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Hapus
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Elements
    const searchInput = document.getElementById('searchInput');
    const filterStatus = document.getElementById('filterStatus');
    const sortBy = document.getElementById('sortBy');

    // Listeners
    searchInput.addEventListener('input', applyFilters);
    filterStatus.addEventListener('change', applyFilters);
    sortBy.addEventListener('change', applyFilters);

    function applyFilters() {
      let filtered = [...allData];
      const q = searchInput.value.toLowerCase();
      const status = filterStatus.value;
      const sort = sortBy.value;

      // 1. Search
      if (q) {
        filtered = filtered.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.client.toLowerCase().includes(q) ||
          p.pic.toLowerCase().includes(q)
        );
      }

      // 2. Filter Status
      if (status) {
        filtered = filtered.filter(p => p.status === status);
      }

      // 4. Sort
      filtered.sort((a, b) => {
        if (sort === 'name_asc') return a.name.localeCompare(b.name);
        if (sort === 'name_desc') return b.name.localeCompare(a.name);
        if (sort === 'deadline') return new Date(a.end_date) - new Date(b.end_date);
        if (sort === 'newest') return new Date(b.start_date) - new Date(a.start_date);
        return 0;
      });

      renderTable(filtered);
    }

    async function loadProjects() {
      try {
        const res = await fetch(API, {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        const data = await res.json();
        allData = data;
        applyFilters();

      } catch (err) {
        console.error(err);
        alert("Gagal load project");
      }
    }

    async function deleteProject(id) {
      const result = await Swal.fire({
        title: 'Yakin hapus proyek ini?',
        text: "Data yang dihapus tidak dapat dikembalikan!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Ya, Hapus!',
        cancelButtonText: 'Batal'
      });

      if (!result.isConfirmed) return;

      try {
        await fetch(API + "/" + id, {
          method: "DELETE",
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        await Swal.fire(
          'Terhapus!',
          'Proyek berhasil dihapus.',
          'success'
        );
        loadProjects();
      } catch (err) {
        console.error(err);
        Swal.fire('Error!', 'Gagal menghapus data.', 'error');
      }
    }

    loadProjects();
  </script>


  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });
  </script>

</body>

</html>
