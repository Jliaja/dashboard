<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Proyek</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/proyek-edit.css">
  <link rel="stylesheet" href="../vendor/tom-select/css/tom-select.default.min.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto">
    <div class="max-w-2xl mx-auto px-4 md:px-8 py-8 md:py-12">

      <div class="flex items-center justify-between mb-8 md:mb-16 a1">
        <div class="flex items-center gap-4">
          <a href="proyek-list.html" class="back-btn">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Kembali
          </a>
        </div>
        <div class="flex items-center gap-3">
          <span class="edit-badge hidden md:inline-flex">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Mode Edit
          </span>
          <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-slate-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>

      <div class="mb-8 md:mb-12 a2">
        <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-3">Manajemen Proyek</p>
        <h1 class="font-extrabold text-3xl md:text-5xl text-gray-900 leading-tight">Edit Data<br>Proyek</h1>
      </div>

      <form id="editForm">

        <div class="form-group a3">
          <span class="step-num">01 &mdash; NAMA</span>
          <label class="form-label" for="nama">Nama Proyek</label>
          <input type="text" id="nama" placeholder="Website Redesign" class="form-input" required>
        </div>

        <div class="form-group a4">
          <span class="step-num">02 &mdash; KLIEN</span>
          <label class="form-label" for="klien">Nama Klien</label>
          <input type="text" id="klien" placeholder="PT. Maju Bersama" class="form-input" required>
        </div>

        <div class="form-group a5">
          <span class="step-num">03 &mdash; STATUS</span>
          <label class="form-label" for="status">Status Proyek</label>
          <select id="status" class="form-select">
            <option>Planning</option>
            <option>On Progress</option>
            <option>Completed</option>
          </select>
        </div>

        <div class="form-group a6">
          <span class="step-num">04 &mdash; TANGGAL</span>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10">
            <div>
              <label class="form-label" for="mulai">Tanggal Mulai</label>
              <input type="date" id="mulai" class="form-input" required>
            </div>
            <div>
              <label class="form-label" for="selesai">Tanggal Selesai</label>
              <input type="date" id="selesai" class="form-input" required>
            </div>
          </div>
        </div>

        <div class="form-group a7 relative z-50">
          <span class="step-num">05 &mdash; PIC</span>
          <label class="form-label" for="pic">PIC (Karyawan)</label>
          <select id="pic" required>
            <option value="">Pilih Karyawan</option>
          </select>
        </div>

        <div class="flex items-center gap-4 pt-10 a8">
          <button type="submit" class="btn-primary">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
            Simpan Perubahan
          </button>
          <a href="proyek-list.html" class="btn-ghost">Batal</a>
        </div>

      </form>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const API = "/api/projects";
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      alert("ID tidak ditemukan");
      window.location.href = "proyek-list.html";
    }

    const namaInput = document.getElementById("nama");
    const klienInput = document.getElementById("klien");
    const statusInput = document.getElementById("status");
    const mulaiInput = document.getElementById("mulai");
    const selesaiInput = document.getElementById("selesai");
    const picInput = document.getElementById("pic");

    async function loadData() {
      try {
        const res = await fetch(API + "/" + id);
        if (!res.ok) {
          alert("Project tidak ditemukan");
          return;
        }

        const data = await res.json();

        namaInput.value = data.name;
        klienInput.value = data.client;
        statusInput.value = data.status;
        mulaiInput.value = data.start_date?.split("T")[0];
        selesaiInput.value = data.end_date?.split("T")[0];
        mulaiInput.value = data.start_date?.split("T")[0];
        selesaiInput.value = data.end_date?.split("T")[0];

        // Set value via Tom Select
        // We know it is initialized because loadEmployees() finishes first
        picInput.tomselect.setValue(data.employee_id);

      } catch (err) {
        console.error(err);
        alert("Gagal load data");
      }
    }

    async function loadEmployees() {
      try {
        const res = await fetch('/api/employee', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        const employees = data.rows || data;
        employees.forEach(emp => {
          const option = document.createElement('option');
          option.value = emp.id;
          option.textContent = emp.name;
          picInput.appendChild(option);
        });
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById("editForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalHtml = btn.innerHTML;

        // Set Loading
        btn.disabled = true;
        btn.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Memproses...`;

        try {
          const res = await fetch(API + "/" + id, {
            method: 'PUT', // Explicitly use PUT
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
              name: namaInput.value,
              client: klienInput.value,
              status: statusInput.value,
              start_date: mulaiInput.value,
              end_date: selesaiInput.value,
              employee_id: picInput.value
            })
          });

          if (!res.ok) {
            throw new Error('Gagal update data proyek');
          }

          await Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Data proyek berhasil diperbarui',
            showConfirmButton: false,
            timer: 1500
          });
          window.location.href = "proyek-list.html";

        } catch (err) {
          console.error(err);
          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: err.message || 'Terjadi kesalahan saat update'
          });
          // Restore button
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });

    // Load employees first, then data
    loadEmployees().then(() => {
      // Init Tom Select
      new TomSelect("#pic", {
        create: false,
        sortField: { field: "text", direction: "asc" }
      });

      loadData();
    });
  </script>
  <script src="../vendor/tom-select/js/tom-select.complete.min.js"></script>

  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });
  </script>

</body>

</html>
