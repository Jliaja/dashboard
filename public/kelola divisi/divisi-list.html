<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Divisi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/divisi-list.css">
</head>
<body class="min-h-screen flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-8 space-y-6">

    <!-- Header -->
    <div class="a1 flex items-center justify-between">
      <div>
        <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
        <h1 class="font-extrabold text-4xl text-gray-900 leading-tight">Kelola Divisi</h1>
        <p class="text-sm text-gray-400 mt-1">Manajemen data divisi perusahaan</p>
      </div>
      <a href="divisi-form.html" class="btn-primary">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        Tambah Divisi
      </a>
    </div>

    <!-- Table Card -->
    <div class="card p-7 a2">

      <!-- Toolbar -->
      <div class="flex items-center justify-between mb-6">
        <p class="text-sm font-semibold text-gray-700">Semua Divisi</p>
        <div class="count-chip">
          Total <span id="divCount">0</span> divisi
        </div>
      </div>

      <!-- Table -->
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Divisi</th>
              <th>Deskripsi</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="divisiTable">
            <tr>
              <td colspan="4">
                <div class="empty-state">
                  <svg class="w-10 h-10 mx-auto mb-3 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                  </svg>
                  Belum ada data divisi
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
const API = "api/departments";

async function loadDivisi() {
  try {
    const res = await fetch(API);
    const data = await res.json();

    const table = document.getElementById("divisiTable");
    document.getElementById("divCount").textContent = data.length;

    if (!data.length) {
      table.innerHTML = `
        <tr>
          <td colspan="4">
            <div class="empty-state">Belum ada data divisi</div>
          </td>
        </tr>`;
      return;
    }

    table.innerHTML = data.map((divisi, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>
          <div class="flex items-center gap-3">
            <div class="div-icon">${divisi.name.charAt(0).toUpperCase()}</div>
            <span class="font-semibold">${divisi.name}</span>
          </div>
        </td>
        <td>${divisi.description || '-'}</td>
        <td>
          <button onclick="editDivisi(${divisi.id})">Edit</button>
          <button onclick="deleteDivisi(${divisi.id})">Hapus</button>
        </td>
      </tr>
    `).join('');

  } catch (err) {
    console.error(err);
    alert("Gagal load data divisi");
  }
}

async function deleteDivisi(id) {
  if (!confirm("Yakin hapus?")) return;

  await fetch(API + "/" + id, {
    method: "DELETE"
  });

  loadDivisi();
}

function editDivisi(id) {
  window.location.href = "divisi-edit.html?id=" + id;
}

loadDivisi();
</script>


</body>
</html>
