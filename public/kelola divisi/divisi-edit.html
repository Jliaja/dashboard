<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Divisi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/divisi-edit.css">
</head>
<body class="min-h-screen flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-8">

    <!-- Back + Badge -->
    <div class="flex items-center justify-between mb-8 a1">
      <a href="divisi-list.html" class="back-btn">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Kembali ke Daftar
      </a>
      <span class="edit-badge">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        Mode Edit
      </span>
    </div>

    <!-- Split Layout -->
    <div class="flex gap-0 a2" style="align-items: flex-start;">

      <!-- Kiri: Preview -->
      <div class="split-left">
        <div>
          <div class="preview-icon" id="previewIcon">?</div>
          <p class="text-xs font-bold tracking-widest uppercase mb-4" style="color:rgba(255,255,255,.25);">Preview Divisi</p>
          <div class="preview-title" id="previewTitle">Memuat data...</div>
          <div class="preview-desc" id="previewDesc">Deskripsi akan ditampilkan di sini.</div>
        </div>
        <div class="preview-tag">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/>
          </svg>
          Edit Divisi
        </div>
      </div>

      <!-- Kanan: Form -->
      <div class="split-right">
        <div class="mb-8 a2">
          <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen Divisi</p>
          <h1 class="font-extrabold text-4xl text-gray-900 leading-tight">Edit Divisi</h1>
          <p class="text-sm text-gray-400 mt-1.5">Perbarui data divisi, preview berubah secara langsung</p>
        </div>

        <form id="editForm" class="space-y-6">

          <div class="a3">
            <label class="form-label" for="nama">Nama Divisi</label>
            <input type="text" id="nama" placeholder="cth. Engineering" class="form-input" required>
          </div>

          <div class="a4">
            <label class="form-label" for="deskripsi">Deskripsi</label>
            <textarea id="deskripsi" placeholder="Tuliskan deskripsi singkat tentang divisi ini..." class="form-textarea" required></textarea>
          </div>

          <div class="divider"></div>

          <div class="flex items-center gap-3 a5">
            <button type="submit" class="btn-primary">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              Simpan Perubahan
            </button>
            <a href="divisi-list.html" class="btn-ghost">Batal</a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("editForm");
    let divisiData = JSON.parse(localStorage.getItem("divisiData")) || [];
    let editId = localStorage.getItem("editDivisiId");

    if (!editId) {
      alert("Data tidak ditemukan!");
      window.location.href = "divisi-list.html";
    }

    const namaInput = document.getElementById("nama");
    const descInput = document.getElementById("deskripsi");

    const divisi = divisiData.find(d => d.id == editId);
    if (divisi) {
      namaInput.value = divisi.nama;
      descInput.value = divisi.deskripsi;
      document.getElementById("previewIcon").textContent = divisi.nama.charAt(0).toUpperCase();
      document.getElementById("previewTitle").textContent = divisi.nama;
      document.getElementById("previewDesc").textContent = divisi.deskripsi;
    }

    namaInput.addEventListener("input", function() {
      const val = this.value.trim();
      document.getElementById("previewIcon").textContent = val ? val.charAt(0).toUpperCase() : "?";
      document.getElementById("previewTitle").textContent = val || "Nama divisi";
    });

    descInput.addEventListener("input", function() {
      const val = this.value.trim();
      document.getElementById("previewDesc").textContent = val || "Deskripsi divisi.";
    });

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      divisiData = divisiData.map(d =>
        d.id == editId
          ? { ...d, nama: namaInput.value, deskripsi: descInput.value }
          : d
      );
      localStorage.setItem("divisiData", JSON.stringify(divisiData));
      localStorage.removeItem("editDivisiId");
      window.location.href = "divisi-list.html";
    });
  </script>

  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
      });
  </script>

</body>
</html>
