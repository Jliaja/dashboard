<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/js/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Divisi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/divisi-edit.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-4 md:p-8">

    <!-- Back + Badge -->
    <div class="flex items-center justify-between mb-8 a1">
      <div class="flex items-center gap-4">
        <a href="divisi-list.html" class="back-btn">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Kembali ke Daftar
        </a>
      </div>
      <div class="flex items-center gap-3">
        <span class="edit-badge hidden md:inline-flex">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
          Mode Edit
        </span>
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-slate-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Split Layout -->
    <div class="flex flex-col lg:flex-row gap-0 a2" style="align-items: flex-start;">

      <!-- Kiri: Preview -->
      <div class="split-left w-full lg:w-[380px] lg:sticky lg:top-8 mb-8 lg:mb-0 static">
        <div>
          <div class="preview-icon" id="previewIcon">?</div>
          <p class="text-xs font-bold tracking-widest uppercase mb-4" style="color:rgba(255,255,255,.25);">Preview
            Divisi</p>
          <div class="preview-title" id="previewTitle">Memuat data...</div>
          <div class="preview-desc" id="previewDesc">Deskripsi akan ditampilkan di sini.</div>
        </div>
        <div class="preview-tag">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5" />
          </svg>
          Edit Divisi
        </div>
      </div>

      <!-- Kanan: Form -->
      <div class="split-right w-full lg:flex-1 p-0 lg:pl-12">
        <div class="mb-8 a2">
          <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen Divisi</p>
          <h1 class="font-extrabold text-2xl md:text-4xl text-gray-900 leading-tight">Edit Divisi</h1>
          <p class="text-sm text-gray-400 mt-1.5">Perbarui data divisi, preview berubah secara langsung</p>
        </div>

        <form id="editForm" class="space-y-6">

          <div class="a3">
            <label class="form-label" for="nama">Nama Divisi</label>
            <input type="text" id="nama" placeholder="cth. Engineering" class="form-input" required>
          </div>

          <div class="a4">
            <label class="form-label" for="deskripsi">Deskripsi</label>
            <textarea id="deskripsi" placeholder="Tuliskan deskripsi singkat tentang divisi ini..."
              class="form-textarea" required></textarea>
          </div>

          <div class="divider"></div>

          <div class="flex items-center gap-3 a5">
            <button type="submit" class="btn-primary w-full md:w-auto justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
              Simpan Perubahan
            </button>
            <a href="divisi-list.html" class="btn-ghost w-full md:w-auto justify-center text-center">Batal</a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <style>
    /* Mobile Overrides for Split Layout defined in CSS */
    @media (max-width: 1024px) {
      .split-left {
        width: 100% !important;
        position: static !important;
        margin-bottom: 2rem !important;
      }

      .split-right {
        padding: 0 !important;
      }
    }
  </style>

  <script>
    const API = "/api/departments";
    const token = localStorage.getItem("token");
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      alert("ID tidak ditemukan");
      window.location.href = "divisi-list.html";
    }

    const form = document.getElementById("editForm");
    const namaInput = document.getElementById("nama");
    const descInput = document.getElementById("deskripsi");

    async function loadData() {
      try {
        const res = await fetch(API + "/" + id);
        if (!res.ok) {
          alert("Data tidak ditemukan");
          return;
        }

        const data = await res.json();
        namaInput.value = data.name;
        descInput.value = data.description;

        document.getElementById("previewIcon").textContent =
          data.name.charAt(0).toUpperCase();
        document.getElementById("previewTitle").textContent = data.name;
        document.getElementById("previewDesc").textContent = data.description;

      } catch (err) {
        console.error(err);
        alert("Gagal load data");
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const originalHtml = btn.innerHTML;

      // Set Loading
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Memproses...`;

      try {
        const res = await fetch(API + "/" + id, {
          method: "PUT",
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            name: namaInput.value,
            description: descInput.value
          })
        });

        if (!res.ok) {
          throw new Error('Gagal update data divisi');
        }

        await Swal.fire({
          icon: 'success',
          title: 'Berhasil!',
          text: 'Data divisi berhasil diperbarui',
          showConfirmButton: false,
          timer: 1500
        });
        window.location.href = "divisi-list.html";

      } catch (err) {
        console.error(err);
        Swal.fire({
          icon: 'error',
          title: 'Gagal',
          text: err.message || 'Terjadi kesalahan saat update'
        });
        // Restore button
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    });

    loadData();
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });
  </script>

</body>

</html>
