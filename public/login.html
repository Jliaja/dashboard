<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/js/auth-check.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
  <script src="vendor/sweetalert2/sweetalert2.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'gradient': 'gradient 20s ease infinite',
            'float': 'float 25s ease-in-out infinite',
            'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
            'shine': 'shine 0.6s',
            'shake': 'shake 0.5s',
            'fade-in': 'fade-in 0.8s ease-out forwards'
          },
          keyframes: {
            gradient: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' }
            },
            float: {
              '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' },
              '25%': { transform: 'translate(30px, -30px) rotate(90deg)' },
              '50%': { transform: 'translate(-20px, 20px) rotate(180deg)' },
              '75%': { transform: 'translate(40px, 10px) rotate(270deg)' }
            },
            'pulse-glow': {
              '0%, 100%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 8px rgba(99, 102, 241, 0.6))' },
              '50%': { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 16px rgba(99, 102, 241, 0.8))' }
            },
            shine: {
              '0%': { left: '-100%' },
              '100%': { left: '100%' }
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%': { transform: 'translateX(-10px)' },
              '75%': { transform: 'translateX(10px)' }
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">

  <!-- Animated Background Gradient -->
  <div
    class="absolute inset-0 bg-gradient-to-br from-indigo-500/20 via-purple-500/20 to-pink-500/20 animate-gradient bg-[length:200%_200%]">
  </div>

  <!-- Floating Shapes -->
  <div
    class="absolute w-32 h-32 sm:w-[300px] sm:h-[300px] bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[30%_70%_70%_30%/30%_30%_70%_70%] top-[10%] left-[5%] opacity-10 animate-float">
  </div>
  <div
    class="absolute w-24 h-24 sm:w-[250px] sm:h-[250px] bg-gradient-to-br from-blue-500 to-purple-600 rounded-[70%_30%_30%_70%/60%_40%_60%_40%] bottom-[15%] right-[10%] opacity-10 animate-float [animation-delay:8s]">
  </div>
  <div
    class="absolute w-20 h-20 sm:w-[200px] sm:h-[200px] bg-gradient-to-br from-pink-500 to-purple-600 rounded-[40%_60%_60%_40%/70%_30%_70%_30%] top-[60%] left-[15%] opacity-10 animate-float [animation-delay:4s]">
  </div>

  <!-- Grid Pattern -->
  <div
    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none">
  </div>

  <!-- Login Container -->
  <div class="w-full max-w-sm sm:max-w-md relative z-10 opacity-0 animate-fade-in my-auto">

    <!-- Login Card -->
    <div
      class="bg-white/[0.03] backdrop-blur-[30px] border border-white/[0.08] rounded-3xl p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.5),inset_0_1px_0_rgba(255,255,255,0.1)]">

      <!-- Logo & Brand -->
      <div class="text-center mb-6 sm:mb-8 opacity-0 animate-fade-in [animation-delay:0.1s]">
        <div class="inline-flex items-center justify-center mb-4">
          <div
            class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-3 rounded-xl shadow-2xl animate-pulse-glow bg-[length:200%_200%] animate-gradient">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
              </path>
            </svg>
          </div>
        </div>
        <h1
          class="text-2xl sm:text-3xl font-bold bg-gradient-to-br from-white to-indigo-200 bg-clip-text text-transparent mb-2 tracking-tight">
          Masuk ke Akun
        </h1>
        <p class="text-gray-400 text-xs sm:text-sm font-mono">
          Kelola bisnis Anda dengan lebih efisien
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4 sm:space-y-5">

        <!-- Email Input -->
        <div class="opacity-0 animate-fade-in [animation-delay:0.2s]">
          <label for="email" class="block text-xs font-semibold text-gray-300 mb-1.5 tracking-wide uppercase">
            Alamat Email
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500 group-focus-within:text-indigo-400 transition-colors duration-300"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207">
                </path>
              </svg>
            </div>
            <input type="email" id="email" placeholder="nama@perusahaan.com" required
              class="w-full pl-12 pr-4 py-3 bg-white/[0.04] border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm transition-all duration-300 hover:bg-white/[0.06] hover:border-white/15 focus:bg-white/[0.08] focus:border-indigo-500/50 focus:shadow-[0_0_0_3px_rgba(99,102,241,0.15),0_8px_16px_rgba(99,102,241,0.1)] focus:outline-none" />
          </div>
        </div>

        <!-- Password Input -->
        <div class="opacity-0 animate-fade-in [animation-delay:0.3s]">
          <label for="password" class="block text-xs font-semibold text-gray-300 mb-1.5 tracking-wide uppercase">
            Kata Sandi
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500 group-focus-within:text-indigo-400 transition-colors duration-300"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
              </svg>
            </div>
            <input type="password" id="password" placeholder="••••••••••" required
              class="w-full pl-12 pr-12 py-3 bg-white/[0.04] border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm transition-all duration-300 hover:bg-white/[0.06] hover:border-white/15 focus:bg-white/[0.08] focus:border-indigo-500/50 focus:shadow-[0_0_0_3px_rgba(99,102,241,0.15),0_8px_16px_rgba(99,102,241,0.1)] focus:outline-none" />

            <!-- Toggle Password Button -->
            <button type="button" id="togglePassword"
              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white transition-colors focus:outline-none">
              <!-- Eye Icon (Show) - Visible by default -->
              <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Slash Icon (Hide) - Hidden by default -->
              <svg id="eyeSlashIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-3">
          <div class="flex items-start">
            <svg class="w-4 h-4 text-red-400 mr-2 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd"
                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                clip-rule="evenodd"></path>
            </svg>
            <p class="text-red-400 text-xs sm:text-sm" id="errorText"></p>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div
          class="flex items-center justify-between text-xs sm:text-sm opacity-0 animate-fade-in [animation-delay:0.4s]">
          <label class="flex items-center cursor-pointer group"
            onclick="Swal.fire({ title: 'Ingat Saya?', text: 'Saat ini fitur ingat saya nonaktif.', icon: 'warning', confirmButtonText: 'Oke', confirmButtonColor: '#f8bb86' })">
            <input type="checkbox" disabled
              class="w-4 h-4 rounded bg-white/5 border-white/20 text-indigo-600 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-0 cursor-pointer transition">
            <span class="ml-2 text-gray-400 group-hover:text-gray-200 transition-colors">Ingat saya</span>
          </label>
          <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors"
            onclick="Swal.fire({ title: 'Lupa Kata Sandi?', text: 'Hubungi admin untuk meminta reset password.', icon: 'info', confirmButtonText: 'Oke', confirmButtonColor: '#4f46e5' })">
            Lupa kata sandi?
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full py-3 sm:py-3.5 rounded-xl text-white font-bold text-sm tracking-wider uppercase shadow-2xl relative overflow-hidden bg-gradient-to-r from-indigo-600 to-purple-600 transition-all duration-400 hover:-translate-y-0.5 hover:shadow-[0_0_30px_rgba(99,102,241,0.6),0_10px_40px_rgba(99,102,241,0.4)] active:translate-y-0 opacity-0 animate-fade-in [animation-delay:0.5s] before:content-[''] before:absolute before:top-0 before:left-[-100%] before:w-full before:h-full before:bg-gradient-to-r before:from-transparent before:via-white/30 before:to-transparent hover:before:animate-shine">
          <span class="relative z-10">Masuk Sekarang</span>
        </button>
      </form>



      <!-- Sign Up -->
      <!-- <div class="mt-6 sm:mt-8 text-center opacity-0 animate-fade-in [animation-delay:0.5s]">
        <p class="text-xs sm:text-sm text-gray-500">
          Belum punya akun?
          <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors ml-1">
            Daftar sekarang
          </a>
        </p>
      </div> -->

    </div>

    <!-- Footer Info -->
    <div class="text-center mt-6 opacity-0 animate-fade-in [animation-delay:0.5s]">
      <p class="text-gray-600 text-[10px] sm:text-xs font-mono">
        © 2025 Company Name. All rights reserved.
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = form.querySelector('button[type="submit"]');

    // Toggle Password Visibility
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeSlashIcon = document.getElementById('eyeSlashIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);

      // Logic:
      // Type is now 'text' (Visible) -> Show Eye Slash (to hide), Hide Eye
      // Type is now 'password' (Hidden) -> Show Eye (to show), Hide Eye Slash

      if (type === 'text') {
        eyeIcon.classList.add('hidden');
        eyeSlashIcon.classList.remove('hidden');
      } else {
        eyeIcon.classList.remove('hidden');
        eyeSlashIcon.classList.add('hidden');
      }
    });

    function setLoading(isLoading) {
      if (isLoading) {
        if (!submitBtn.dataset.originalHtml) submitBtn.dataset.originalHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <div class="flex items-center justify-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="relative z-10">Memproses...</span>
          </div>`;
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = submitBtn.dataset.originalHtml;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(true);

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);

          await Swal.fire({
            title: 'Berhasil Masuk!',
            text: 'Selamat datang kembali',
            icon: 'success',
            timer: 1500,
            showConfirmButton: false
          });

          if (data.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else {
            window.location.href = '/customer-dashboard.html';
          }
        } else {
          Swal.fire({
            title: 'Gagal Masuk',
            text: data.message,
            icon: 'error',
            confirmButtonText: 'Coba Lagi',
            confirmButtonColor: '#d33'
          });
        }
      } catch (err) {
        Swal.fire({
          title: 'Error',
          text: 'Terjadi kesalahan sistem',
          icon: 'error'
        });
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>

</html>
