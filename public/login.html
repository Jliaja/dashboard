<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'gradient': 'gradient 20s ease infinite',
            'float': 'float 25s ease-in-out infinite',
            'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
            'shine': 'shine 0.6s',
            'shake': 'shake 0.5s',
            'fade-in': 'fade-in 0.8s ease-out forwards'
          },
          keyframes: {
            gradient: {
              '0%, 100%': { backgroundPosition: '0% 50%' },
              '50%': { backgroundPosition: '100% 50%' }
            },
            float: {
              '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' },
              '25%': { transform: 'translate(30px, -30px) rotate(90deg)' },
              '50%': { transform: 'translate(-20px, 20px) rotate(180deg)' },
              '75%': { transform: 'translate(40px, 10px) rotate(270deg)' }
            },
            'pulse-glow': {
              '0%, 100%': { transform: 'scale(1)', filter: 'drop-shadow(0 0 8px rgba(99, 102, 241, 0.6))' },
              '50%': { transform: 'scale(1.05)', filter: 'drop-shadow(0 0 16px rgba(99, 102, 241, 0.8))' }
            },
            shine: {
              '0%': { left: '-100%' },
              '100%': { left: '100%' }
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%': { transform: 'translateX(-10px)' },
              '75%': { transform: 'translateX(10px)' }
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  
  <!-- Animated Background Gradient -->
  <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/20 via-purple-500/20 to-pink-500/20 animate-gradient bg-[length:200%_200%]"></div>
  
  <!-- Floating Shapes -->
  <div class="absolute w-[300px] h-[300px] bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[30%_70%_70%_30%/30%_30%_70%_70%] top-[10%] left-[5%] opacity-10 animate-float"></div>
  <div class="absolute w-[250px] h-[250px] bg-gradient-to-br from-blue-500 to-purple-600 rounded-[70%_30%_30%_70%/60%_40%_60%_40%] bottom-[15%] right-[10%] opacity-10 animate-float [animation-delay:8s]"></div>
  <div class="absolute w-[200px] h-[200px] bg-gradient-to-br from-pink-500 to-purple-600 rounded-[40%_60%_60%_40%/70%_30%_70%_30%] top-[60%] left-[15%] opacity-10 animate-float [animation-delay:4s]"></div>
  
  <!-- Grid Pattern -->
  <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>

  <!-- Login Container -->
  <div class="w-full max-w-md relative z-10 opacity-0 animate-fade-in">
    
    <!-- Login Card -->
    <div class="bg-white/[0.03] backdrop-blur-[30px] border border-white/[0.08] rounded-3xl p-10 shadow-[0_20px_60px_rgba(0,0,0,0.5),inset_0_1px_0_rgba(255,255,255,0.1)]">
      
      <!-- Logo & Brand -->
      <div class="text-center mb-10 opacity-0 animate-fade-in [animation-delay:0.1s]">
        <div class="inline-flex items-center justify-center mb-6">
          <div class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-4 rounded-2xl shadow-2xl animate-pulse-glow bg-[length:200%_200%] animate-gradient">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-4xl font-bold bg-gradient-to-br from-white to-indigo-200 bg-clip-text text-transparent mb-3 tracking-tight">
          Masuk ke Akun
        </h1>
        <p class="text-gray-400 text-sm font-mono">
          Kelola bisnis Anda dengan lebih efisien
        </p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-6">
        
        <!-- Email Input -->
        <div class="opacity-0 animate-fade-in [animation-delay:0.2s]">
          <label for="email" class="block text-sm font-semibold text-gray-300 mb-2 tracking-wide uppercase text-xs">
            Alamat Email
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500 group-focus-within:text-indigo-400 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
              </svg>
            </div>
            <input
              type="email"
              id="email"
              placeholder="nama@perusahaan.com"
              required
              class="w-full pl-12 pr-4 py-4 bg-white/[0.04] border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm transition-all duration-300 hover:bg-white/[0.06] hover:border-white/15 focus:bg-white/[0.08] focus:border-indigo-500/50 focus:shadow-[0_0_0_3px_rgba(99,102,241,0.15),0_8px_16px_rgba(99,102,241,0.1)] focus:outline-none"
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="opacity-0 animate-fade-in [animation-delay:0.3s]">
          <label for="password" class="block text-sm font-semibold text-gray-300 mb-2 tracking-wide uppercase text-xs">
            Kata Sandi
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-500 group-focus-within:text-indigo-400 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              type="password"
              id="password"
              placeholder="••••••••••"
              required
              class="w-full pl-12 pr-4 py-4 bg-white/[0.04] border border-white/10 rounded-xl text-white placeholder-gray-500 text-sm transition-all duration-300 hover:bg-white/[0.06] hover:border-white/15 focus:bg-white/[0.08] focus:border-indigo-500/50 focus:shadow-[0_0_0_3px_rgba(99,102,241,0.15),0_8px_16px_rgba(99,102,241,0.1)] focus:outline-none"
            />
          </div>
        </div>

        <!-- Error Message -->
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 rounded-xl p-4">
          <div class="flex items-start">
            <svg class="w-5 h-5 text-red-400 mr-2 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
            </svg>
            <p class="text-red-400 text-sm" id="errorText"></p>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between text-sm opacity-0 animate-fade-in [animation-delay:0.4s]">
          <label class="flex items-center cursor-pointer group">
            <input type="checkbox" class="w-4 h-4 rounded bg-white/5 border-white/20 text-indigo-600 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-0 cursor-pointer transition">
            <span class="ml-2 text-gray-400 group-hover:text-gray-200 transition-colors">Ingat saya</span>
          </label>
          <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">
            Lupa kata sandi?
          </a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full py-4 rounded-xl text-white font-bold text-sm tracking-wider uppercase shadow-2xl relative overflow-hidden bg-gradient-to-r from-indigo-600 to-purple-600 transition-all duration-400 hover:-translate-y-0.5 hover:shadow-[0_0_30px_rgba(99,102,241,0.6),0_10px_40px_rgba(99,102,241,0.4)] active:translate-y-0 opacity-0 animate-fade-in [animation-delay:0.5s] before:content-[''] before:absolute before:top-0 before:left-[-100%] before:w-full before:h-full before:bg-gradient-to-r before:from-transparent before:via-white/30 before:to-transparent hover:before:animate-shine"
        >
          <span class="relative z-10">Masuk Sekarang</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8 opacity-0 animate-fade-in [animation-delay:0.5s]">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/10"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="px-4 bg-transparent text-gray-500 text-xs font-mono">ATAU MASUK DENGAN</span>
        </div>
      </div>

      <!-- Social Login -->
      <div class="grid grid-cols-2 gap-4 opacity-0 animate-fade-in [animation-delay:0.5s]">
        <button type="button" class="flex items-center justify-center px-4 py-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 hover:border-white/20 transition-all duration-300 group">
          <svg class="w-5 h-5 mr-2 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Google</span>
        </button>
        <button type="button" class="flex items-center justify-center px-4 py-3 bg-white/5 border border-white/10 rounded-xl hover:bg-white/10 hover:border-white/20 transition-all duration-300 group">
          <svg class="w-5 h-5 mr-2 group-hover:scale-110 transition-transform" fill="#1877F2" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          <span class="text-sm font-semibold text-gray-300 group-hover:text-white transition-colors">Facebook</span>
        </button>
      </div>

      <!-- Sign Up -->
      <div class="mt-8 text-center opacity-0 animate-fade-in [animation-delay:0.5s]">
        <p class="text-sm text-gray-500">
          Belum punya akun? 
          <a href="#" class="text-indigo-400 hover:text-indigo-300 font-semibold transition-colors ml-1">
            Daftar sekarang
          </a>
        </p>
      </div>

    </div>

    <!-- Footer Info -->
    <div class="text-center mt-6 opacity-0 animate-fade-in [animation-delay:0.5s]">
      <p class="text-gray-600 text-xs font-mono">
        © 2025 Company Name. All rights reserved.
      </p>
    </div>
  </div>

  <script>
const form = document.getElementById('loginForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const res = await fetch('https://wicked-katleen-companyuhuy-cda70a58.koyeb.app/api/auth/login', { 
  method: 'POST', 
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email, password })
});




  const data = await res.json();

  if (res.ok) {
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);

    if (data.role === 'admin') {
      window.location.href = '/admin-dashboard.html';
    } else {
      window.location.href = '/customer-dashboard.html';
    }
  } else {
    document.getElementById('errorText').innerText = data.message;
    document.getElementById('error').classList.remove('hidden');
  }
});
</script>
</body>
</html>
