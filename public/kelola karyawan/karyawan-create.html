<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/karyawan-create.css">
</head>
<body class="min-h-screen flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-8">

    <!-- Back -->
    <div class="mb-6 a1">
      <a href="karyawan-list.html" class="back-btn">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Kembali ke Daftar
      </a>
    </div>

    <!-- Center Card -->
    <div class="flex justify-center a2">
      <div class="card p-10 w-full" style="max-width: 520px;">

        <!-- Card Header -->
        <div class="mb-8">
          <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
          <h1 class="font-extrabold text-3xl text-gray-900">Tambah Karyawan</h1>
          <p class="text-sm text-gray-400 mt-1.5">Isi semua data karyawan baru dengan benar</p>
        </div>

        <div class="divider mb-8"></div>

        <form id="form" class="space-y-5">

          <div>
            <label class="form-label" for="name">Nama Lengkap</label>
            <input id="name" type="text" placeholder="cth. Budi Santoso" class="form-input">
          </div>

          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" placeholder="cth. budi@perusahaan.com" class="form-input">
          </div>

          <div>
            <label class="form-label" for="position">Jabatan</label>
            <input id="position" type="text" placeholder="cth. Frontend Developer" class="form-input">
          </div>

          <div>
  <label class="form-label" for="division">Divisi</label>
  <select id="division" class="form-select">
    <option value="">Pilih Divisi</option>
  </select>
</div>


          <div>
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select">
              <option value="aktif">Aktif</option>
              <option value="nonaktif">Nonaktif</option>
            </select>
          </div>

          <div class="divider"></div>

          <div class="space-y-3 pt-1">
            <button type="submit" class="btn-primary">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
              </svg>
              Simpan Karyawan
            </button>
            <a href="karyawan-list.html" class="btn-ghost">Batal</a>
          </div>

        </form>
      </div>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
if (!token) window.location.href = '/login.html';

// Load divisi saat page load
async function loadDepartments() {
  const token = localStorage.getItem('token'); // kalo pake auth
  try {
    const res = await fetch('/api/departments', {
      headers: token ? { 'Authorization': 'Bearer ' + token } : {}
    });
    const departments = await res.json();

    const select = document.getElementById('division');
    departments.forEach(dep => {
      const option = document.createElement('option');
      option.value = dep.name; // atau dep.id kalau mau simpan ID
      option.textContent = dep.name;
      select.appendChild(option);
    });
  } catch(err) {
    console.error('Gagal load divisi', err);
  }
}

// Panggil saat page load
loadDepartments();


// Form submit
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    position: document.getElementById('position').value,
    division: document.getElementById('division').value,
    status: document.getElementById('status').value
  };

  try {
    const res = await fetch('/api/employee', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    console.log("Response:", result);

    if (!res.ok) {
      alert("Gagal: " + JSON.stringify(result));
      return;
    }

    alert("Berhasil ditambahkan!");
    window.location.href = 'karyawan-list.html';
  } catch (err) {
    console.error(err);
    alert("Terjadi error!");
  }
});

  </script>

  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
      });
  </script>

</body>
</html>
