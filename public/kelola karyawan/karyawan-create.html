<!DOCTYPE html>
<html lang="id">

<head>
  <script src="/js/auth-check.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/karyawan-create.css">
  <link rel="stylesheet" href="../vendor/tom-select/css/tom-select.default.min.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-4 md:p-8">

    <!-- Back & Hamburger -->
    <div class="mb-6 a1 flex items-center justify-between">
      <a href="karyawan-list.html" class="back-btn">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Kembali ke Daftar
      </a>
      <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-slate-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

    <!-- Center Card -->
    <div class="flex justify-center a2">
      <div class="card p-6 md:p-10 w-full" style="max-width: 520px;">

        <!-- Card Header -->
        <div class="mb-8">
          <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
          <h1 class="font-extrabold text-2xl md:text-3xl text-gray-900">Tambah Karyawan</h1>
          <p class="text-sm text-gray-400 mt-1.5">Isi semua data karyawan baru dengan benar</p>
        </div>

        <div class="divider mb-8"></div>

        <form id="form" class="space-y-5">

          <div>
            <label class="form-label" for="name">Nama Lengkap</label>
            <input id="name" type="text" placeholder="cth. Budi Santoso" class="form-input">
          </div>

          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" placeholder="cth. budi@perusahaan.com" class="form-input">
          </div>

          <div>
            <label class="form-label" for="position">Jabatan</label>
            <input id="position" type="text" placeholder="cth. Frontend Developer" class="form-input">
          </div>

          <div>
            <label class="form-label" for="department_id">Divisi</label>
            <select id="department_id">
              <option value="">Pilih Divisi</option>
            </select>
          </div>

          <div>
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select">
              <option value="aktif">Aktif</option>
              <option value="nonaktif">Nonaktif</option>
            </select>
          </div>

          <div class="divider"></div>

          <div class="space-y-3 pt-1">
            <button type="submit" class="btn-primary">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
              </svg>
              Simpan Karyawan
            </button>
            <a href="karyawan-list.html" class="btn-ghost">Batal</a>
          </div>

        </form>
      </div>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const originalHtml = btn.innerHTML;

      // Set Loading
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Memproses...`;

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        position: document.getElementById('position').value,
        department_id: document.getElementById('department_id').value,
        status: document.getElementById('status').value
      };

      try {
        const res = await fetch('/api/employee', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.message || 'Gagal menambahkan karyawan');
        }

        await Swal.fire({
          icon: 'success',
          title: 'Berhasil!',
          text: 'Data karyawan berhasil ditambahkan',
          showConfirmButton: false,
          timer: 1500
        });
        window.location.href = 'karyawan-list.html';

      } catch (err) {
        console.error(err);
        Swal.fire({
          icon: 'error',
          title: 'Gagal',
          text: err.message || 'Terjadi kesalahan sistem'
        });
        // Restore button only on error (on success we redirect)
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    });
  </script>

  <script>
    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });

    // Load Departments
    async function loadDepartments() {
      try {
        const res = await fetch('/api/departments', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const departments = await res.json();
        const deptSelect = document.getElementById('department_id');

        departments.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept.id;
          option.textContent = dept.name;
          deptSelect.appendChild(option);
        });

        // Init Tom Select
        new TomSelect("#department_id", {
          create: false,
          sortField: { field: "text", direction: "asc" }
        });

      } catch (err) {
        console.error('Gagal load departments:', err);
      }
    }
    loadDepartments();
  </script>
  <script src="../vendor/tom-select/js/tom-select.complete.min.js"></script>

</body>

</html>
