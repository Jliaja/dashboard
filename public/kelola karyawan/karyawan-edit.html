<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/karyawan-edit.css">
</head>

<body class="min-h-screen flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-8 space-y-6">

    <!-- Top nav -->
    <div class="flex items-center justify-between a1">
      <a href="karyawan-list.html" class="back-btn">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Kembali ke Daftar
      </a>
      <span class="edit-badge">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        Mode Edit
      </span>
    </div>

    <!-- Page title -->
    <div class="a2">
      <p class="text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen Karyawan</p>
      <h1 class="font-extrabold text-4xl text-gray-900 leading-tight">Edit Data Karyawan</h1>
      <p class="text-sm text-gray-400 mt-1.5">Perbarui informasi karyawan lalu simpan perubahan</p>
    </div>

    <!-- Form Card -->
    <div class="card p-8 a3">
      <form id="form">

        <!-- Section: Info Dasar -->
        <p class="section-title mb-5">Informasi Dasar</p>
        <div class="grid grid-cols-2 gap-x-6 gap-y-5 mb-8">

          <div>
            <label class="form-label" for="name">Nama Lengkap</label>
            <input id="name" type="text" placeholder="Budi Santoso" class="form-input">
          </div>

          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" placeholder="budi@perusahaan.com" class="form-input">
          </div>

        </div>

        <div class="divider mb-8"></div>

        <!-- Section: Pekerjaan -->
        <p class="section-title mb-5">Detail Pekerjaan</p>
        <div class="grid grid-cols-2 gap-x-6 gap-y-5 mb-8">

          <div>
            <label class="form-label" for="position">Jabatan</label>
            <input id="position" type="text" placeholder="Frontend Developer" class="form-input">
          </div>

          <div>
            <label class="form-label" for="department_id">Divisi</label>
            <select id="department_id" class="form-select">
              <option value="">Pilih Divisi</option>
            </select>
          </div>

          <div class="form-full">
            <label class="form-label" for="status">Status Karyawan</label>
            <select id="status" class="form-select">
              <option value="aktif">Aktif</option>
              <option value="nonaktif">Nonaktif</option>
            </select>
          </div>

        </div>

        <div class="divider mb-8"></div>

        <!-- Actions -->
        <div class="flex items-center gap-3 a4">
          <button type="submit" class="btn-primary">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
            Simpan Perubahan
          </button>
          <a href="karyawan-list.html" class="btn-ghost">Batal</a>
        </div>

      </form>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const positionInput = document.getElementById('position');
    const departmentInput = document.getElementById('department_id');
    const statusInput = document.getElementById('status');


    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        name: nameInput.value,
        email: emailInput.value,
        position: positionInput.value,
        department_id: departmentInput.value,
        status: statusInput.value
      };

      try {
        const res = await fetch('/api/employee/' + id, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        console.log(result);

        if (!res.ok) { alert("Gagal update"); return; }

        alert("Berhasil update!");
        window.location.href = 'karyawan-list.html';

      } catch (err) {
        console.error(err);
        alert("Terjadi error saat update");
      }
    });

    async function loadEmployee() {
      if (!id) return; // kalau id ga ada, skip

      try {
        const res = await fetch('/api/employee/' + id, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) { alert("Gagal load data karyawan"); return; }
        const emp = await res.json();

        // isi form
        nameInput.value = emp.name;
        emailInput.value = emp.email;
        positionInput.value = emp.position;
        // divisionInput.value = emp.division || ''; // REMOVED

        // Load departments then select correct one
        await loadDepartments(emp.department_id); // Pass current department_id

        statusInput.value = emp.status.toLowerCase() === 'aktif' ? 'aktif' : 'nonaktif';
      } catch (err) {
        console.error(err);
        alert("Terjadi error saat load data");
      }
    }
    // Load Departments function
    async function loadDepartments(selectedId = null) {
      try {
        const res = await fetch('/api/departments', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const departments = await res.json();
        const deptSelect = document.getElementById('department_id');

        // Clear existing options except first
        deptSelect.innerHTML = '<option value="">Pilih Divisi</option>';

        departments.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept.id;
          option.textContent = dept.name;
          if (selectedId && dept.id === selectedId) {
            option.selected = true;
          }
          deptSelect.appendChild(option);
        });
      } catch (err) {
        console.error('Gagal load departments:', err);
      }
    }

    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
      });
    loadEmployee();

  </script>

</body>

</html>
