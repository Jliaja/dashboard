<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/karyawan-list.css">
  <link rel="stylesheet" href="../vendor/tom-select/css/tom-select.default.min.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../vendor/tom-select/js/tom-select.complete.min.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

    <!-- Header -->
    <div class="a1 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto">
        <button onclick="toggleSidebar()" class="md:hidden p-1 -ml-1 text-slate-400 hover:text-slate-600 flex-shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div>
          <p class="syne text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
          <h1 class="syne font-extrabold text-2xl md:text-4xl text-gray-900 leading-tight">Daftar Karyawan</h1>
          <p class="text-sm text-gray-400 mt-1">Kelola seluruh data karyawan perusahaan</p>
        </div>
      </div>
      <a href="karyawan-create.html" class="btn-primary w-full md:w-auto justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        Tambah Karyawan
      </a>
    </div>

    <!-- Table Card -->
    <div class="card p-5 md:p-7 a2">

      <!-- Toolbar -->
      <div class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col md:flex-row justify-between gap-4">

          <!-- Left: Search & Filters -->
          <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto flex-wrap">
            <div class="relative w-full md:w-64">
              <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              <input type="text" id="searchInput" placeholder="Cari karyawan..." class="search-box w-full"
                style="padding-left:40px">
            </div>

            <div class="divisi-select-wrapper w-full md:w-64">
              <select id="filterDept" placeholder="Semua Divisi" autocomplete="off">
                <option value="">Semua Divisi</option>
              </select>
            </div>

            <select id="filterStatus" class="search-box cursor-pointer w-full md:w-auto">
              <option value="">Semua Status</option>
              <option value="aktif">Aktif</option>
              <option value="nonaktif">Nonaktif</option>
            </select>

            <select id="sortBy" class="search-box cursor-pointer w-full md:w-auto">
              <option value="name_asc">Nama (A-Z)</option>
              <option value="name_desc">Nama (Z-A)</option>
              <option value="newest">Terbaru</option>
              <option value="oldest">Terlama</option>
            </select>
          </div>

          <!-- Right: Count -->
          <div class="count-chip self-end md:self-center">
            Total <span id="rowCount">0</span> karyawan
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="tbl-wrap overflow-x-auto">
        <table class="w-full min-w-[800px]">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Email</th>
              <th>Jabatan</th>
              <th>Divisi</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="employeeTable">
            <tr>
              <td colspan="7">
                <div class="empty-state">
                  <svg class="w-10 h-10 mx-auto mb-3 text-gray-200 animate-spin" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                  </svg>
                  Memuat data...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    let allData = [];

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    }

    function renderTable(data) {
      const table = document.getElementById('employeeTable');
      document.getElementById('rowCount').textContent = data.length;

      if (data.length === 0) {
        table.innerHTML = `<tr><td colspan="7"><div class="empty-state">Tidak ada data karyawan</div></td></tr>`;
        return;
      }

      table.innerHTML = data.map((emp, index) => `
        <tr>
          <td><span class="no-badge">${index + 1}</span></td>
          <td>
            <div class="flex items-center gap-3">
              <div class="emp-avatar">${emp.name.charAt(0).toUpperCase()}</div>
              <div>
                <p class="font-semibold text-gray-900 syne text-sm">${emp.name}</p>
              </div>
            </div>
          </td>
          <td class="text-gray-400 text-sm">${emp.email}</td>
          <td><span class="font-semibold text-gray-700 text-sm">${emp.position}</span></td>
          <td class="text-gray-400 text-sm">${emp.department_name || '—'}</td>
          <td>
            <span class="badge ${emp.status.toLowerCase() === 'aktif' || emp.status.toLowerCase() === 'active' ? 'badge-active' : 'badge-inactive'}">
              <span class="badge-dot"></span>
              ${emp.status}
            </span>
          </td>
          <td>
            <div class="flex items-center justify-end gap-2">
              <a href="karyawan-edit.html?id=${emp.id}" class="btn-edit">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Edit
              </a>
              <button type="button" onclick="deleteEmployee('${emp.id}')" class="btn-del">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Hapus
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Elements
    const searchInput = document.getElementById('searchInput');
    const filterDept = document.getElementById('filterDept');
    const filterStatus = document.getElementById('filterStatus');
    const sortBy = document.getElementById('sortBy');

    // Event Listeners
    searchInput.addEventListener('input', applyFilters);
    filterDept.addEventListener('change', applyFilters);
    filterStatus.addEventListener('change', applyFilters);
    sortBy.addEventListener('change', applyFilters);

    function applyFilters() {
      let filtered = [...allData];
      const q = searchInput.value.toLowerCase();
      const dept = filterDept.value;
      const status = filterStatus.value.toLowerCase();
      const sort = sortBy.value;

      // 1. Search
      if (q) {
        filtered = filtered.filter(e =>
          e.name.toLowerCase().includes(q) ||
          e.email.toLowerCase().includes(q) ||
          e.position.toLowerCase().includes(q) ||
          (e.department_name || '').toLowerCase().includes(q)
        );
      }

      // 2. Filter Dept
      if (dept) {
        filtered = filtered.filter(e => e.department_id == dept);
      }

      // 3. Filter Status
      if (status) {
        filtered = filtered.filter(e => e.status.toLowerCase() === status);
      }

      // 4. Sorting
      filtered.sort((a, b) => {
        if (sort === 'name_asc') return a.name.localeCompare(b.name);
        if (sort === 'name_desc') return b.name.localeCompare(a.name);
        if (sort === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
        if (sort === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
        return 0;
      });

      renderTable(filtered);
    }

    async function loadDepartments() {
      try {
        const res = await fetch('/api/departments', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const departments = await res.json();

        // Populate filter dropdown
        departments.forEach(d => {
          const option = document.createElement('option');
          option.value = d.id;
          option.textContent = d.name;
          filterDept.appendChild(option);
        });

        // Init Tom Select
        new TomSelect('#filterDept', {
          create: false,
          sortField: { field: "text", direction: "asc" },
          placeholder: 'Semua Divisi'
        });

      } catch (err) {
        console.error('Gagal load departments', err);
      }
    }

    async function loadEmployees() {
      try {
        const res = await fetch('/api/employee', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();
        allData = data.rows || data;

        applyFilters(); // Initial render with defaults

      } catch (err) {
        console.error(err);
      }
    }


    async function deleteEmployee(id) {
      const result = await Swal.fire({
        title: 'Yakin hapus karyawan ini?',
        text: "Data yang dihapus tidak dapat dikembalikan!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Ya, Hapus!',
        cancelButtonText: 'Batal'
      });

      if (!result.isConfirmed) return;

      try {
        const res = await fetch('/api/employee/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
          await Swal.fire(
            'Terhapus!',
            'Data karyawan berhasil dihapus.',
            'success'
          );
          loadEmployees();
        } else {
          Swal.fire('Gagal!', 'Gagal menghapus data.', 'error');
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error!', 'Terjadi kesalahan sistem.', 'error');
      }
    }

    loadDepartments();
    loadEmployees();

    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });
  </script>


</body>

</html>
