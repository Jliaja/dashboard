<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Karyawan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/karyawan-list.css">
  <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
  <script src="../js/sidebar.js"></script>
</head>

<body class="h-screen overflow-hidden flex">

  <div id="sidebar-container"></div>

  <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">

    <!-- Header -->
    <div class="a1 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto">
        <button onclick="toggleSidebar()" class="md:hidden p-1 -ml-1 text-slate-400 hover:text-slate-600 flex-shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div>
          <p class="syne text-[10px] font-bold tracking-[.2em] uppercase text-gray-400 mb-1">Manajemen</p>
          <h1 class="syne font-extrabold text-2xl md:text-4xl text-gray-900 leading-tight">Daftar Karyawan</h1>
          <p class="text-sm text-gray-400 mt-1">Kelola seluruh data karyawan perusahaan</p>
        </div>
      </div>
      <a href="karyawan-create.html" class="btn-primary w-full md:w-auto justify-center">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        Tambah Karyawan
      </a>
    </div>

    <!-- Table Card -->
    <div class="card p-5 md:p-7 a2">

      <!-- Toolbar -->
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
        <div class="relative w-full md:w-auto">
          <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Cari nama, email, jabatan..." class="search-box w-full md:w-80"
            style="padding-left:40px" oninput="filterTable(this.value)">
        </div>
        <div class="count-chip self-end md:self-auto">
          Total <span id="rowCount">0</span> karyawan
        </div>
      </div>

      <!-- Table -->
      <div class="tbl-wrap overflow-x-auto">
        <table class="w-full min-w-[800px]">
          <thead>
            <tr>
              <th>Nama</th>
              <th>Email</th>
              <th>Jabatan</th>
              <th>Divisi</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="employeeTable">
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <svg class="w-10 h-10 mx-auto mb-3 text-gray-200" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  Memuat data...
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    let allData = [];

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      window.location.href = '/login.html';
    }

    function renderTable(data) {
      const table = document.getElementById('employeeTable');
      document.getElementById('rowCount').textContent = data.length;

      if (data.length === 0) {
        table.innerHTML = `<tr><td colspan="6"><div class="empty-state">Tidak ada data karyawan</div></td></tr>`;
        return;
      }

      table.innerHTML = data.map(emp => `
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <div class="emp-avatar">${emp.name.charAt(0).toUpperCase()}</div>
              <div>
                <p class="font-semibold text-gray-900 syne text-sm">${emp.name}</p>
              </div>
            </div>
          </td>
          <td class="text-gray-400 text-sm">${emp.email}</td>
          <td><span class="font-semibold text-gray-700 text-sm">${emp.position}</span></td>
          <td class="text-gray-400 text-sm">${emp.department_name || '—'}</td>
          <td>
            <span class="badge ${emp.status.toLowerCase() === 'aktif' || emp.status.toLowerCase() === 'active' ? 'badge-active' : 'badge-inactive'}">
              <span class="badge-dot"></span>
              ${emp.status}
            </span>
          </td>
          <td>
            <div class="flex items-center justify-end gap-2">
              <a href="karyawan-edit.html?id=${emp.id}" class="btn-edit">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Edit
              </a>
              <button type="button" onclick="deleteEmployee('${emp.id}')" class="btn-del">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                Hapus
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterTable(q) {
      const filtered = allData.filter(e =>
        e.name.toLowerCase().includes(q.toLowerCase()) ||
        e.email.toLowerCase().includes(q.toLowerCase()) ||
        e.position.toLowerCase().includes(q.toLowerCase()) ||
        (e.department_name || '').toLowerCase().includes(q.toLowerCase())
      );
      renderTable(filtered);
    }

    async function loadEmployees() {
      try {
        const res = await fetch('/api/employee', {

          headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await res.json();
        console.log(data); // cek ini di console

        allData = data.rows || data;
        renderTable(allData);

      } catch (err) {
        console.error(err);
      }
    }


    async function deleteEmployee(id) {
      const result = await Swal.fire({
        title: 'Yakin hapus karyawan ini?',
        text: "Data yang dihapus tidak dapat dikembalikan!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Ya, Hapus!',
        cancelButtonText: 'Batal'
      });

      if (!result.isConfirmed) return;

      try {
        const res = await fetch('/api/employee/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.ok) {
          await Swal.fire(
            'Terhapus!',
            'Data karyawan berhasil dihapus.',
            'success'
          );
          loadEmployees();
        } else {
          Swal.fire('Gagal!', 'Gagal menghapus data.', 'error');
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error!', 'Terjadi kesalahan sistem.', 'error');
      }
    }

    loadEmployees();

    fetch('../components/sidebar.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        loadUser();
      });
  </script>


</body>

</html>
