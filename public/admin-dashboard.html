<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="min-h-screen flex">

  
  
 
  
  <div id="sidebar-container"></div>
  <!-- Main -->
  <main class="flex-1 overflow-y-auto p-7 space-y-6">

    <!-- Header -->
    <div class="card p-7 flex items-center justify-between a1">
      <div>
        <p class="text-xs font-700 tracking-[.18em] uppercase text-indigo-400 mb-1">Overview</p>
        <h1 class="syne font-800 text-3xl text-gray-900 mb-1">Welcome back, <span class="text-indigo-500">Admin!</span> 👋</h1>
        <p class="text-sm text-slate-400">Here's what's happening with your dashboard today.</p>
      </div>
      <div class="flex gap-2">
        <button class="notif-btn" aria-label="Notifikasi">
          <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-2 right-2 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
        </button>
        <button class="notif-btn avatar-logo" aria-label="Profile">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <div class="card p-6 a2">
        <div class="flex items-start justify-between mb-5">
          <div class="icon-box grad-purple-pink">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </div>
          <span class="badge-green text-xs font-700 px-2.5 py-1 rounded-lg flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
            +12%
          </span>
        </div>
        <p class="text-xs font-700 tracking-widest uppercase text-slate-400 mb-1">Total Karyawan</p>
        <p id="totalEmployees" class="stat-num text-4xl font-800 text-gray-900 mb-1"></p>
        <p class="text-xs text-slate-400">Active employees</p>
      </div>

      <div class="card p-6 a3">
        <div class="flex items-start justify-between mb-5">
          <div class="icon-box grad-purple-pink">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
          </div>
          <span class="badge-blue text-xs font-700 px-2.5 py-1 rounded-lg">ACTIVE</span>
        </div>
        <p class="text-xs font-700 tracking-widest uppercase text-slate-400 mb-1">Total Divisi</p>
        <p id="totalDivisions" class="stat-num text-4xl font-800 text-gray-900 mb-1"></p>
        <p class="text-xs text-slate-400">Department divisions</p>
      </div>

      <div class="card p-6 a4">
        <div class="flex items-start justify-between mb-5">
          <div class="icon-box grad-orange-red">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <span class="badge-pink text-xs font-700 px-2.5 py-1 rounded-lg flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 bg-pink-500 rounded-full animate-pulse"></span>LIVE
          </span>
        </div>
        <p class="text-xs font-700 tracking-widest uppercase text-slate-400 mb-1">Total Proyek</p>
        <p id="totalProjects" class="stat-num text-4xl font-800 text-gray-900 mb-1"></p>
        <p class="text-xs text-slate-400">Running projects</p>
      </div>

    </div>

    <!-- Chart -->
    <div class="card p-7 a5">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h3 class="syne font-700 text-xl text-gray-900">Analytics Overview</h3>
          <p class="text-sm text-slate-400 mt-0.5">Visual representation of your data</p>
        </div>
      </div>
      <div class="chart-area chart-height">
        <canvas id="dashboardChart"></canvas>
      </div>
    </div>

    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let dashboardChart;

function updateChart(emp, div, pro) {
  const ctx = document.getElementById('dashboardChart').getContext('2d');

  if (dashboardChart) dashboardChart.destroy();

  dashboardChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Karyawan', 'Divisi', 'Proyek'],
      datasets: [{
        label: 'Jumlah Data',
        data: [emp, div, pro],
        backgroundColor: [
          'rgba(59,130,246,.85)',
          'rgba(139,92,246,.85)',
          'rgba(249,115,22,.85)'
        ],
        borderRadius: 12
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } }
    }
  });
}

async function loadDashboard() {
  try {
    const res = await fetch("/api/dashboard/stats");
    const data = await res.json();

    document.getElementById("totalEmployees").textContent = data.totalEmployees;
    document.getElementById("totalDivisions").textContent = data.totalDivisions;
    document.getElementById("totalProjects").textContent = data.totalProjects;

    updateChart(
      data.totalEmployees,
      data.totalDivisions,
      data.totalProjects
    );

  } catch (error) {
    console.error("Dashboard error:", error);
  }
}

document.addEventListener("DOMContentLoaded", loadDashboard);
</script>
  <script>
  fetch('components/sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;
    })
    .catch(error => console.error('Sidebar gagal dimuat:', error));
</script>


</body>
</html>
